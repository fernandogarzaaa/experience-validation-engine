name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Maintains a rolling "chore(release): x.y.z" pull request: it accumulates
  # conventional commits landing on main, and merging it tags the release.
  # The PR body is editable, so a generated changelog entry can be rewritten
  # into the curated style this project uses before it ships.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs on the push that merges the release PR.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which ties the published tarball to this
      # workflow run so consumers can verify where it was built.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci

      # Re-verify at the tag. Publishing is the one place where "it passed on
      # the PR" is not good enough.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run mcp:smoke

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
