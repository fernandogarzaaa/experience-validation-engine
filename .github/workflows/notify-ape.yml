name: notify-ape
# Notifies fernandogarzaaa/ape-mcp to re-vendor this repo (see ape-mcp
# .github/workflows/auto-update.yml, event-only triggers).
# Requires secret APE_NOTIFY_TOKEN in this repo (PAT with write on ape-mcp).
# Do NOT merge this workflow until that secret exists, or the dispatch step fails.
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.APE_NOTIFY_TOKEN }}
          repository: fernandogarzaaa/ape-mcp
          event-type: source-updated
          client-payload: '{"repo": "eve", "sha": "${{ github.sha }}"}'
