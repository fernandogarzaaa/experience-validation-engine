name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  demo:
    name: Offline demo session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run EVE against the mock app
        # Quoted: the bare "mock:" token would otherwise be parsed as a YAML mapping.
        run: "node bin/eve.js run mock: --persona curious-explorer --steps 20 --cognitive --utility --quiet"
      - name: Validate the benchmark suite (construct validity)
        run: node bin/eve.js benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: eve-demo-report
          path: .eve-output/
