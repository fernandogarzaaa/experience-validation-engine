name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch; the matrix is expensive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Biome (lint + format + import order)
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Thresholds live in vitest.config.ts; this fails the build on regression.
      - run: npm run coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  browser:
    name: Real-browser adapter contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The adapters are typed against hand-written duck types for the driver's
      # Page, so only a real browser can catch upstream API drift.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Gate on what ships to users. A high/critical advisory in a published
      # dependency breaks the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Dev-tooling advisories are worth seeing but must not block a PR on
      # someone else's release schedule.
      - name: Audit everything (advisory only)
        continue-on-error: true
        run: npm audit

  demo:
    name: Offline demo session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run EVE against the mock app
        # Quoted: the bare "mock:" token would otherwise be parsed as a YAML mapping.
        run: "node bin/eve.js run mock: --persona curious-explorer --steps 20 --cognitive --utility --quiet"
      - name: Validate the benchmark suite (construct validity)
        run: node bin/eve.js benchmark
      - name: Smoke-test the MCP server (stdio handshake + tools/list)
        run: npm run mcp:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: eve-demo-report
          path: .eve-output/
