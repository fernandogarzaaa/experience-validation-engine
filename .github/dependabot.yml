version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for the dev toolchain rather than five. These only affect CI,
      # so they are safe to review together.
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Playwright, Puppeteer and Selenium are optional peers pinned by the
      # consumer, not by EVE. Bumping the floor here would narrow what
      # installs cleanly for no benefit.
      - dependency-name: playwright
      - dependency-name: puppeteer
      - dependency-name: selenium-webdriver
      - dependency-name: "@anthropic-ai/sdk"
      # @types/node's major is the only thing that tells tsc which Node APIs
      # exist — it must track engines.node's floor, not the latest release.
      # Left to auto-update, the two drift apart silently: tsc keeps passing
      # because newer types are typically additive, but nothing then stops
      # code from using an API the floor doesn't actually have. Bump this
      # only by hand, in the same commit that moves engines.node and the CI
      # matrix — never as an independent Dependabot PR.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    labels:
      - dependencies
    commit-message:
      prefix: ci
